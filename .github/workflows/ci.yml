name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test test/unit

      - name: Integration tests
        run: bun test test/integration

      - name: Compatibility tests
        run: bun test test/compatibility

      - name: Build standalone executable
        run: bun run build

      - name: Verify executable from a clean directory
        run: |
          CLEAN_DIR=$(mktemp -d)
          cp dist/litegresd "$CLEAN_DIR/"
          cd "$CLEAN_DIR"
          LITEGRES_RUNTIME_DIR="$CLEAN_DIR/rt" ./litegresd version
          LITEGRES_RUNTIME_DIR="$CLEAN_DIR/rt" ./litegresd start --background
          LITEGRES_RUNTIME_DIR="$CLEAN_DIR/rt" ./litegresd status --json | grep '"state": "READY"'
          LITEGRES_RUNTIME_DIR="$CLEAN_DIR/rt" ./litegresd stop

      - name: Process-level tests (compiled binary)
        env:
          LITEGRES_BIN: ${{ github.workspace }}/dist/litegresd
        run: bun test test/process

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: litegres-diag-logs
          path: |
            /tmp/litegres-*.log
            **/*.log
          if-no-files-found: ignore

  jvm:
    name: JVM client + JUnit 5 extension (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone executable
        run: bun run build

      - name: Start daemon
        env:
          LITEGRES_RUNTIME_DIR: ${{ runner.temp }}/litegres-rt
        run: |
          mkdir -p "$LITEGRES_RUNTIME_DIR"
          ./dist/litegresd start --background
          sleep 1
          ./dist/litegresd status --json | grep '"state": "READY"'

      - name: JVM build + tests
        env:
          LITEGRES_RUNTIME_DIR: ${{ runner.temp }}/litegres-rt
        run: |
          cd jvm
          ./gradlew --no-daemon build test

      - name: Stop daemon
        if: always()
        env:
          LITEGRES_RUNTIME_DIR: ${{ runner.temp }}/litegres-rt
        run: ./dist/litegresd stop || true

      - name: Upload JVM test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: litegres-jvm-reports
          path: jvm/**/build/reports/tests/**
          if-no-files-found: ignore
